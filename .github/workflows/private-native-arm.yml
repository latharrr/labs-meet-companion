          #!/usr/bin/env python3
          """PROPOSED private GHCR publication, not authorization. Requires reviewed workflow."""
          import importlib.util,json,os,re,subprocess,sys,tempfile,urllib.error,urllib.request
          from pathlib import Path
          
          def api(path,*,absent=False):
              request=urllib.request.Request('https://api.github.com/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code==404 and absent:return None
                  raise RuntimeError('GitHub metadata check failed HTTP '+str(error.code)) from None
          
          def main():
              if os.environ.get('GITHUB_ACTIONS')!='true' or os.environ.get('GITHUB_RUN_ATTEMPT')!='1':raise RuntimeError('Only first manual Actions attempt allowed')
              owner,repo=os.environ['GITHUB_REPOSITORY'].split('/')
              run=os.environ['GITHUB_RUN_ID'];sha=os.environ['GITHUB_SHA']
              if owner!='latharrr' or repo!='labs-meet-companion' or not re.fullmatch(r'[0-9]+',run) or not re.fullmatch(r'[0-9a-f]{40}',sha):raise RuntimeError('Unexpected publication identity')
              name='labs-meet-arm-'+run;image='ghcr.io/'+owner+'/'+name+':'+sha
              metadata=api('repos/'+owner+'/'+repo)
              if metadata.get('private') is not False:raise RuntimeError('Public repository required for approved free standard runner route')
              if api('users/'+owner+'/packages/container/'+name,absent=True) is not None:raise RuntimeError('Fresh package namespace required; no overwrite')
              if not Path('BUILD-AND-SYNTHETIC-PASSED').exists():raise RuntimeError('Build/synthetic evidence missing')
              info=json.loads(subprocess.check_output(['docker','image','inspect',image],text=True,timeout=25))[0]
              if Path('BUILD-AND-SYNTHETIC-PASSED').read_text().strip()!=info['Id']:raise RuntimeError('Image differs from checked image')
              if info.get('Config',{}).get('Labels',{}).get('org.opencontainers.image.source')!='https://github.com/'+owner+'/'+repo:raise RuntimeError('Source label missing')
              spec=importlib.util.spec_from_file_location('guard',str(Path(__file__).with_name('github-arm-build.py')));guard=importlib.util.module_from_spec(spec);spec.loader.exec_module(guard)
              start=json.loads(Path('resource-baseline.json').read_text());context=os.environ['RUNNER_TEMP']
              if guard.reason(guard.sample(context),start):raise RuntimeError('Prepush capacity threshold')
              with tempfile.TemporaryDirectory(prefix='labs-ghcr-',dir=context) as directory:
                  env={**os.environ,'DOCKER_CONFIG':directory};token=env.pop('GH_TOKEN')
                  with open('registry-login.log','w') as output:
                      subprocess.run(['docker','login','ghcr.io','--username',owner,'--password-stdin'],input=token+'\n',text=True,stdout=output,stderr=subprocess.STDOUT,env=env,check=True,timeout=30)
                  # Parent environment lacks credentials except this temporary config; build already ended.
                  previous=os.environ.get('DOCKER_CONFIG');os.environ['DOCKER_CONFIG']=directory
                  try:guard.bounded(['docker','push',image],480,context,start,log='registry-push.log')
                  finally:
                      if previous is None:os.environ.pop('DOCKER_CONFIG',None)
                      else:os.environ['DOCKER_CONFIG']=previous
              package=api('users/'+owner+'/packages/container/'+name)
              if package['visibility']!='private' or package.get('repository',{}).get('full_name')!=owner+'/'+repo:raise RuntimeError('Published package audience/association unverified: stop and report')
              info=json.loads(subprocess.check_output(['docker','image','inspect',image],text=True,timeout=25))[0]
              digests=[d for d in info.get('RepoDigests',[]) if d.startswith('ghcr.io/'+owner+'/'+name+'@sha256:')]
              if len(digests)!=1:raise RuntimeError('Registry digest unverified')
              Path('PRIVATE-IMAGE-RESULT.json').write_text(json.dumps({'image':image,'digest':digests[0],'package_url':package['html_url'],'visibility':'private','source_commit':sha},indent=2)+'\n')
              print(Path('PRIVATE-IMAGE-RESULT.json').read_text())
          
          if __name__=='__main__':main()
          LABS_REVIEWED_SOURCE
